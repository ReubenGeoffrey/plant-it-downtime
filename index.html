<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Plant IT Downtime Management Portal</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Chart.js for Live Plant Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- Three.js for 3D Visualizer Studio (Local with CDN fallback) -->
  <script defer src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  
  <!-- ExcelJS & FileSaver for Rich Premium Styled Excel Export (Local with CDN fallback) -->
  <script src="exceljs.min.js"></script>
  <script src="FileSaver.min.js"></script>
  <script>
    if (typeof ExcelJS === "undefined") {
      document.write('<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"><\\/script>');
    }
    if (typeof saveAs === "undefined") {
      document.write('<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"><\\/script>');
    }
  </script>
  
  <!-- SheetJS for Fallback -->
  <script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  
  <!-- Supabase Cloud SDK v2 & Data Layer (Local with CDN fallback) -->
  <script src="supabase.min.js"></script>
  <script>
    if (typeof supabase === "undefined") {
      document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\\/script>');
    }
  </script>
  <script src="supabase-client.js?v=2.3"></script>
  
  <!-- Custom Yokohama Theme Stylesheet & Observability Design Tokens -->
  <link rel="stylesheet" href="tokens.css?v=1.0">
  <link rel="stylesheet" href="styles.css?v=2.2">
  
  <!-- Favicon with new Yokohama Logo -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            yoko: {
              red: '#E60012',
              'red-dark': '#B3000E',
              'red-light': '#FF2B3C',
              black: '#0F1115',
              'black-light': '#1A1D23',
              gray: '#1E222A'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
  
  <!-- Header Navigation -->
  <header class="bg-[#0F1115] text-white border-b border-slate-800 sticky top-0 z-40 shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        
        <!-- Brand Title & Icon -->
        <div class="flex items-center gap-3">
          <div class="h-10 w-10 rounded-lg bg-red-600/20 border border-red-500/30 flex items-center justify-center text-[#E60012] shadow-xs">
            <i class="fa-solid fa-industry text-lg"></i>
          </div>
          <div>
            <h1 class="text-xs sm:text-sm font-bold text-slate-200 tracking-wide uppercase">PLANT IT DOWNTIME MANAGEMENT PORTAL</h1>
          </div>
        </div>

        <!-- Live Shift & Clock Center/Right -->
        <div class="flex items-center gap-3">
          <div id="current-shift-badge" class="px-2.5 py-1 rounded-full text-xs font-bold border flex items-center gap-1.5 bg-emerald-500/20 text-emerald-300 border-emerald-500/30">
            <span class="w-2 h-2 rounded-full bg-current animate-pulse"></span> <span id="current-shift-text">Shift A (7am - 3pm)</span>
          </div>
          
          <div id="live-clock" class="hidden sm:flex items-center gap-2 text-xs bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800 font-mono text-white">
            <span id="live-clock-date" class="text-slate-400 font-medium"></span> <span id="live-clock-time" class="text-white font-bold tracking-wider"></span>
          </div>

          <!-- Environment Badge (Local Dev vs Vercel Cloud) -->
          <div id="envStatusBadge" class="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[10px] font-mono font-bold bg-slate-900 border border-slate-800 transition-all"></div>

          <!-- Live Cloud Sync Button (Supabase Cloud Sync) -->
          <button type="button" id="btnCloudSync" onclick="triggerManualCloudSync()" class="px-2.5 py-1.5 rounded-lg text-xs font-bold bg-slate-900 hover:bg-slate-800 text-emerald-400 border border-emerald-500/30 transition-all flex items-center gap-1.5 shadow-xs active:scale-95 cursor-pointer" title="Sync downtime records &amp; accounts with Supabase Cloud Database">
            <i id="cloudSyncIcon" class="fa-solid fa-cloud-arrow-up text-emerald-400 text-xs"></i>
            <span id="cloudSyncText" class="font-mono text-[11px] hidden sm:inline">Cloud Sync</span>
            <span id="cloudSyncPulse" class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          </button>

          <!-- Dynamic Auth Button / Logged in User Badge -->
          <div id="headerAuthAction"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- =========================================================================
       APPLICATION MOUNT ROOT & LOGIN GATEKEEPER (SEC-01)
       ========================================================================= -->
  <main id="appMountRoot" class="flex-1 flex flex-col">
    <!-- ADMIN LOGIN GATEKEEPER (Displayed FIRST For Unauthenticated Users) -->
    <section id="adminGatekeeperSection" class="min-h-[calc(100vh-8rem)] flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 sm:p-8 relative border-t-4 border-[#E60012] animate-scale-up">
        <div class="text-center mb-6">
          <div class="w-16 h-16 rounded-2xl bg-red-50 border border-red-100 flex items-center justify-center text-[#E60012] mx-auto mb-3 shadow-xs">
            <i class="fa-solid fa-industry text-2xl"></i>
          </div>
          <h2 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight uppercase">Plant Portal Sign In</h2>
          <p class="text-xs text-slate-400 font-medium mt-1">Enter your authorized username &amp; password</p>
        </div>

        <form id="adminLoginForm" class="space-y-4">
          <div>
            <label class="form-label-modern" for="adminUsername">Username</label>
            <div class="relative">
              <input type="text" id="adminUsername" required value="" class="form-input-modern pl-9 font-medium" placeholder="Username" autocomplete="username">
              <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            </div>
          </div>

          <div>
            <label class="form-label-modern" for="adminPassword">Password</label>
            <div class="relative">
              <input type="password" id="adminPassword" required value="" class="form-input-modern pl-9 pr-10 font-medium" placeholder="Enter password" autocomplete="current-password">
              <i class="fa-solid fa-key absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
              <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs" title="Toggle password visibility">
                <i id="togglePassIcon" class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="pt-2">
            <button type="submit" class="btn-yoko-red w-full py-3 text-sm font-bold shadow-lg flex items-center justify-center gap-2">
              <i class="fa-solid fa-right-to-bracket"></i>
              <span>Sign In to Portal</span>
            </button>
          </div>

        </form>
      </div>
    </section>
  </main>

  <!-- =========================================================================
       DOWNTIME APPLICATION TEMPLATE (Unlocked & Mounted Post-Authentication)
       ========================================================================= -->
  <template id="authenticatedAppTemplate">
  <div id="downtimeAppContainer" class="flex-1 flex flex-col">
    <!-- Sub-navigation Tabs Bar -->
    <div class="bg-white border-b border-slate-200 shadow-sm sticky top-16 z-30">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center gap-1.5 overflow-x-auto py-2">
          <button id="tabBtnEntry" type="button" onclick="switchTab('entry')" class="tab-btn active-tab-red text-xs">
            <i class="fa-solid fa-pen-to-square mr-1.5"></i> Downtime Entry
          </button>
          <button id="tabBtnKpi" type="button" onclick="switchTab('kpi')" class="tab-btn text-xs">
            <i class="fa-solid fa-chart-pie mr-1.5"></i> Dashboard
          </button>
          <button id="tabBtnLogs" type="button" onclick="switchTab('logs')" class="tab-btn text-xs">
            <i class="fa-solid fa-table-list mr-1.5"></i> Incident Records
          </button>
          <button id="tabBtnAll" type="button" onclick="switchTab('all')" class="tab-btn text-xs">
            <i class="fa-solid fa-layer-group mr-1.5"></i> Full Overview
          </button>
          <button id="tabBtnSettings" type="button" onclick="switchTab('settings')" class="tab-btn text-xs hidden" title="System Master Settings (Admin Only)">
            <i class="fa-solid fa-sliders text-[#E60012] mr-1.5"></i> Master Settings
          </button>
        </div>
      </div>
    </div>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-8">

    <!-- =========================================================================
         TAB 1 VIEW: IT DOWN TIME ENTRY (Always Open)
         ========================================================================= -->
    <div id="viewEntryContainer">
    <section id="form-card" class="card-modern card-highlight-red p-6 sm:p-8 bg-white shadow-xl relative overflow-hidden">
      
      <!-- Form Header -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between pb-6 mb-6 border-b border-slate-200 gap-4">
        <div class="flex items-center gap-4">
          <div>
            <div class="flex items-center gap-2 mb-1">
              <span class="inline-block w-2.5 h-6 bg-[#E60012] rounded-sm"></span>
              <h2 class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight uppercase">
                IT Downtime Entry
              </h2>
            </div>

          </div>
        </div>

        <!-- Quick Form Actions -->
        <div class="flex items-center gap-2 ml-4 sm:ml-0">
          <button type="button" id="btn-clear-form" class="btn-yoko-outline text-xs py-1.5 px-3 text-amber-700 bg-amber-50 hover:bg-amber-100 border-amber-200">
            <i class="fa-solid fa-rotate-left text-amber-600"></i> Clear Data
          </button>
        </div>
      </div>

      <!-- Form Inputs Grid -->
      <form id="downtimeForm" class="space-y-6">
        
        <!-- ROW 1: Issue Date, Nature of Issue, Area of Issue, Machine Code -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          
          <!-- 1. Issue Date & Start Time (MATH-04: Timestamp & Shift Tracking) -->
          <div>
            <label class="form-label-modern" for="issueDate">
              Issue Date &amp; Start Time <span class="required-star">*</span>
            </label>
            <div class="grid grid-cols-5 gap-1.5">
              <div class="col-span-3 relative">
                <input type="date" id="issueDate" name="issueDate" required onchange="handleDateTimeChange()" class="form-input-modern pr-8 font-medium text-xs">
                <i class="fa-regular fa-calendar absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-xs"></i>
              </div>
              <div class="col-span-2 relative">
                <input type="time" id="issueTime" name="issueTime" onchange="handleDateTimeChange()" class="form-input-modern px-2 font-medium text-xs font-mono" title="Incident Start Time">
              </div>
            </div>
          </div>

          <!-- 2. Nature of the Issue -->
          <div>
            <label class="form-label-modern">
              Nature of Issue <span class="required-star">*</span>
            </label>
            <input type="hidden" id="nature" name="nature" value="MES">
            <div id="natureContainer" class="flex items-center gap-1.5 flex-wrap p-1 bg-slate-100 rounded-xl border border-slate-200 min-h-[42px]">
              <!-- Dynamically populated from masterNatures in app.js -->
            </div>
          </div>

          <!-- 3. Area of Issue (Searchable Multi-Select with Select All / Unselect All) -->
          <div class="relative" id="formAreaDropdownWrapper">
            <label class="form-label-modern" for="btnToggleFormAreaDropdown">
              Area / Plant <span class="required-star">*</span>
            </label>
            <input type="hidden" id="area" name="area" value="">
            
            <button type="button" id="btnToggleFormAreaDropdown" onclick="toggleFormDropdown('area', event)" class="form-input-modern py-2.5 px-3.5 text-xs w-full font-semibold flex items-center justify-between gap-2 bg-white hover:bg-slate-50 border border-slate-200 shadow-xs cursor-pointer select-none rounded-xl">
              <span class="flex items-center gap-2 truncate">
                <i class="fa-solid fa-building-flag text-[#E60012] text-xs"></i>
                <span id="labelFormArea" class="text-slate-500">-- Select Area / Plant --</span>
              </span>
              <div class="flex items-center gap-1.5 flex-shrink-0">
                <span id="badgeFormAreaCount" class="hidden text-[10px] font-mono font-bold text-slate-500 px-1.5 py-0.5 rounded bg-slate-100">0</span>
                <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
              </div>
            </button>

            <!-- Popover Panel for Area Selection -->
            <div id="panelFormAreaDropdown" class="hidden absolute left-0 top-full mt-1.5 w-full sm:min-w-[280px] bg-white rounded-xl shadow-2xl border border-slate-200 z-50 p-3 space-y-2">
              <!-- Search inside Area Dropdown -->
              <div class="relative">
                <input type="text" id="searchFormArea" oninput="filterFormAreaList()" placeholder="Search area/plant..." class="form-input-modern pl-8 py-1.5 text-xs w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
              </div>
              <!-- Action Buttons: Select All / Unselect All -->
              <div class="flex items-center justify-between pt-1 border-b border-slate-100 pb-1.5 text-xs">
                <div class="flex items-center gap-2">
                  <button type="button" onclick="selectAllFormAreas(true)" class="text-[11px] font-bold text-blue-600 hover:text-blue-800 transition-colors cursor-pointer">
                    Select All
                  </button>
                  <span class="text-slate-300">|</span>
                  <button type="button" onclick="selectAllFormAreas(false)" class="text-[11px] font-bold text-slate-500 hover:text-red-600 transition-colors cursor-pointer">
                    Unselect All
                  </button>
                </div>
                <span id="badgeFormAreaPanelCount" class="text-[10px] font-mono font-bold text-slate-500 px-1.5 py-0.5 rounded bg-slate-100">0 Selected</span>
              </div>
              <!-- Scrollable Checkbox List -->
              <div id="listFormAreaCheckboxes" class="max-h-52 overflow-y-auto space-y-0.5 pr-1 divide-y divide-slate-50 text-xs">
                <!-- Dynamically populated in app.js -->
              </div>
            </div>
          </div>

          <!-- 4. Machine Code with Critical (Yes/No) Option (Searchable Multi-Select with Select All / Unselect All) -->
          <div class="relative" id="formMachineDropdownWrapper">
            <div class="flex items-center justify-between mb-1">
              <label class="form-label-modern mb-0" for="btnToggleFormMachineDropdown">
                Machine Code <span class="required-star">*</span>
              </label>
              <!-- Critical / Machine Specific Option Switcher (UI-04: Clear accessible label) -->
              <div class="flex items-center gap-1.5 bg-slate-100 px-2 py-0.5 rounded-lg border border-slate-200" title="Is this a machine-specific / critical bottleneck issue?">
                <span class="text-[10px] font-bold text-slate-600 uppercase tracking-wider">Critical:</span>
                <button type="button" id="btn-crit-no" onclick="setCriticalMachine('No')" class="px-2 py-0.5 text-[10px] font-bold rounded-md bg-white text-slate-800 shadow-sm transition-all cursor-pointer" aria-pressed="true">
                  No
                </button>
                <button type="button" id="btn-crit-yes" onclick="setCriticalMachine('Yes')" class="px-2 py-0.5 text-[10px] font-bold rounded-md text-slate-500 hover:text-red-600 transition-all cursor-pointer" aria-pressed="false">
                  Yes
                </button>
              </div>
            </div>
            <input type="hidden" id="isCritical" name="isCritical" value="No">
            <input type="hidden" id="machineNo" name="machineNo" value="">

            <button type="button" id="btnToggleFormMachineDropdown" onclick="toggleFormDropdown('machine', event)" class="form-input-modern py-2.5 px-3.5 text-xs w-full font-mono font-bold flex items-center justify-between gap-2 bg-white hover:bg-slate-50 border border-slate-200 shadow-xs cursor-pointer select-none rounded-xl">
              <span class="flex items-center gap-2 truncate">
                <i class="fa-solid fa-industry text-[#E60012] text-xs"></i>
                <span id="labelFormMachine" class="text-slate-500 font-sans font-semibold">-- Select Machine Code --</span>
              </span>
              <div class="flex items-center gap-1.5 flex-shrink-0">
                <span id="badgeFormMachineCount" class="hidden text-[10px] font-mono font-bold text-slate-500 px-1.5 py-0.5 rounded bg-slate-100">0</span>
                <i class="fa-solid fa-chevron-down text-[10px] text-slate-400"></i>
              </div>
            </button>

            <!-- Popover Panel for Machine Selection -->
            <div id="panelFormMachineDropdown" class="hidden absolute left-0 top-full mt-1.5 w-full sm:min-w-[340px] bg-white rounded-xl shadow-2xl border border-slate-200 z-50 p-3 space-y-2">
              <!-- Search inside Machine Dropdown -->
              <div class="relative">
                <input type="text" id="searchFormMachine" oninput="filterFormMachineList()" placeholder="Search machine code, name, process..." class="form-input-modern pl-8 py-1.5 text-xs w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
              </div>
              <!-- Action Buttons: Select All / Unselect All -->
              <div class="flex items-center justify-between pt-1 border-b border-slate-100 pb-1.5 text-xs">
                <div class="flex items-center gap-2">
                  <button type="button" onclick="selectAllFormMachines(true)" class="text-[11px] font-bold text-blue-600 hover:text-blue-800 transition-colors cursor-pointer">
                    Select All
                  </button>
                  <span class="text-slate-300">|</span>
                  <button type="button" onclick="selectAllFormMachines(false)" class="text-[11px] font-bold text-slate-500 hover:text-red-600 transition-colors cursor-pointer">
                    Unselect All
                  </button>
                </div>
                <span id="badgeFormMachinePanelCount" class="text-[10px] font-mono font-bold text-slate-500 px-1.5 py-0.5 rounded bg-slate-100">0 Selected</span>
              </div>
              <!-- Scrollable Checkbox List -->
              <div id="listFormMachineCheckboxes" class="max-h-56 overflow-y-auto space-y-0.5 pr-1 divide-y divide-slate-50 text-xs">
                <!-- Dynamically populated in app.js -->
              </div>
            </div>

            <!-- Machine Micro-telemetry & Badges -->
            <div class="flex items-center justify-between mt-1 px-0.5">
              <span id="processBadge" class="hidden text-[10px] px-1.5 py-0.5 rounded bg-slate-900 text-white font-bold font-mono"></span>
              <span id="criticalBadge" class="hidden text-[10px] px-2 py-0.5 rounded font-bold font-mono"></span>
            </div>
          </div>

        </div>

        <!-- ROW 2: Downtime Metrics (Min, Affected, Total), Category, Issue Details, Action Plan Taken -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-6 gap-4">
          
          <!-- 6a. Downtime Min (Per Machine) -->
          <div class="lg:col-span-1">
            <label class="form-label-modern" for="downtimeMinutes" title="Breakdown duration per machine in minutes">
              Downtime Min <span class="required-star">*</span>
            </label>
            <div class="relative">
              <input type="number" id="downtimeMinutes" name="downtimeMinutes" min="1" max="100000" placeholder="Min" required oninput="calculateTotalDowntime()" class="form-input-modern font-mono font-bold text-red-600 text-base pr-10">
              <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[11px] font-bold text-slate-400">mins</span>
            </div>
          </div>

          <!-- 6b. No of Machines Affected -->
          <div class="lg:col-span-1">
            <label class="form-label-modern" for="affectedMachines" title="Number of machines affected by this downtime event">
              No of Machines <span class="required-star">*</span>
            </label>
            <div class="relative">
              <input type="number" id="affectedMachines" name="affectedMachines" min="1" max="1000" value="1" required oninput="calculateTotalDowntime()" class="form-input-modern font-mono font-bold text-slate-800 text-base pr-10">
              <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[11px] font-bold text-slate-400">qty</span>
            </div>
          </div>

          <!-- 6c. Total Downtime Mins (Auto-Calculated) -->
          <div class="lg:col-span-1">
            <label class="form-label-modern" for="totalDowntimeMinutes" title="Total Downtime Min = Downtime Min * No of Machines Affected">
              Total DT Mins
            </label>
            <div class="relative">
              <input type="number" id="totalDowntimeMinutes" name="totalDowntimeMinutes" readonly placeholder="0" class="form-input-modern font-mono font-black text-red-700 bg-red-50/70 border-red-200 text-base pr-10 cursor-not-allowed">
              <span class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[11px] font-bold text-red-500">mins</span>
            </div>
          </div>

          <!-- 7. Category -->
          <div class="lg:col-span-1">
            <label class="form-label-modern" for="category">
              Category <span class="required-star">*</span>
            </label>
            <select id="category" name="category" required class="form-input-modern font-semibold">
              <!-- Dynamically populated from masterCategories in app.js -->
            </select>
          </div>

          <!-- 8. Issue Details (Manual Type) -->
          <div class="lg:col-span-1">
            <label class="form-label-modern" for="issueDetails">
              Issue Details <span class="required-star">*</span>
            </label>
            <input type="text" id="issueDetails" name="issueDetails" required placeholder="Enter issue details..." class="form-input-modern font-semibold text-slate-800">
          </div>

          <!-- 9. Action Plan Taken (Manual Type) -->
          <div class="lg:col-span-1">
            <label class="form-label-modern" for="actionPlan">
              Action Plan Taken
            </label>
            <input type="text" id="actionPlan" name="actionPlan" placeholder="Enter action plan taken..." class="form-input-modern font-semibold text-slate-800">
          </div>

        </div>

        <!-- ROW 3: Responsibility, Issue Closed Date, Solved By, Issue Closure Status -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          
          <!-- 10. Responsibility -->
          <div>
            <label class="form-label-modern" for="responsibility">
              Responsibility <span class="required-star">*</span>
            </label>
            <select id="responsibility" name="responsibility" required class="form-input-modern font-bold text-slate-800">
              <!-- Dynamically populated from masterResponsibilities in app.js -->
            </select>
          </div>

          <!-- 11. Issue Closed Date & End Time (MATH-04: Timestamp & Shift Tracking) -->
          <div id="closed-date-container" style="opacity: 0.6;">
            <label class="form-label-modern" for="closedDate">
              Closed Date &amp; End Time
            </label>
            <div class="grid grid-cols-5 gap-1.5">
              <div class="col-span-3 relative">
                <input type="date" id="closedDate" name="closedDate" disabled onchange="handleDateTimeChange()" class="form-input-modern pr-8 font-medium text-xs">

              <span id="exportModalAvail" class="text-base font-black text-emerald-600 font-mono">100%</span>
            </div>
          </div>
        </div>

        <!-- Dynamic Excel Format Note -->
        <div class="flex items-center justify-between px-3 py-2 rounded-xl bg-emerald-50/70 border border-emerald-200 text-xs">
          <div class="flex items-center gap-2 text-emerald-900 font-semibold">
            <i class="fa-solid fa-file-excel text-emerald-600"></i>
            <span id="exportModalFormatNote">Export Format: Multi-Sheet Excel (Logs + Total Month Uptime Matrix + All Monthly Sheets)</span>
          </div>
          <span id="exportModalFormatBadge" class="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-emerald-600 text-white">ALL MONTHS</span>
        </div>

      </div>

      <!-- Modal Footer Action Buttons -->
      <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex flex-wrap items-center justify-between gap-2">
        <button type="button" onclick="closeDateExportModal()" class="px-3.5 py-2 text-xs font-bold text-slate-500 hover:text-slate-800 transition-colors cursor-pointer">
          Cancel
        </button>
        <div class="flex items-center gap-2">
          <button type="button" onclick="executeExportFromModal('csv')" class="px-3.5 py-2 text-xs font-bold rounded-xl bg-blue-600 hover:bg-blue-700 text-white flex items-center gap-1.5 shadow-sm transition-all border border-blue-700 active:scale-95 cursor-pointer">
            <i class="fa-solid fa-file-csv"></i> Download CSV
          </button>
          <button type="button" onclick="executeExportFromModal('excel')" class="px-4 py-2 text-xs font-black rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white flex items-center gap-1.5 shadow-sm transition-all border border-emerald-700 active:scale-95 cursor-pointer" title="Export Excel (.xlsx) with Executive Dashboard (Sheet 1), Incident Logs & Uptime Matrix">
            <i class="fa-solid fa-file-excel"></i> Download Excel (.xlsx)
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- =========================================================================
       MODAL: IMPORT DAILY DOWNTIME ENTRY EXCEL FILE (.XLSX)
       ========================================================================= -->
  <div id="importDowntimeModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full max-h-[90vh] flex flex-col overflow-hidden border border-slate-200 animate-scale-up">
      
      <!-- Modal Header -->
      <div class="px-6 py-4 bg-slate-900 text-white flex items-center justify-between border-b-2 border-[#E60012] flex-shrink-0">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-violet-600/20 text-violet-400 flex items-center justify-center">
            <i class="fa-solid fa-file-import text-base"></i>
          </div>
          <div>
            <h3 class="font-black text-sm uppercase tracking-wider">Import Daily Downtime Entry Excel</h3>
            <p class="text-[11px] text-slate-400">Map & import plant downtime incident logs from .xlsx</p>
          </div>
        </div>
        <button type="button" onclick="closeImportDowntimeModal()" class="text-slate-400 hover:text-white transition-colors p-1 text-base cursor-pointer" title="Close modal">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Modal Body (Scrollable) -->
      <div class="p-6 space-y-5 overflow-y-auto flex-1">
        
        <!-- Drag & Drop Zone + File Selector -->
        <div id="dropZoneDowntimeExcel" ondragover="handleDowntimeDragOver(event)" ondragleave="handleDowntimeDragLeave(event)" ondrop="handleDowntimeFileDrop(event)" class="border-2 border-dashed border-slate-300 hover:border-violet-500 rounded-2xl p-6 text-center bg-slate-50 hover:bg-violet-50/40 transition-all cursor-pointer" onclick="document.getElementById('inputDowntimeExcelFile').click()">
          <input type="file" id="inputDowntimeExcelFile" accept=".xlsx,.xls" class="hidden" onchange="handleDowntimeFileSelect(event)">
          <div class="w-12 h-12 rounded-2xl bg-violet-100 text-violet-600 flex items-center justify-center mx-auto mb-3 text-xl">
            <i class="fa-solid fa-cloud-arrow-up"></i>
          </div>
          <h4 class="text-sm font-bold text-slate-800 mb-1">Click to browse or drag & drop Daily Downtime Excel file</h4>
          <p class="text-xs text-slate-500">Supports .xlsx and .xls (e.g. <span class="font-mono font-bold text-slate-700">Template Import 2.xlsx</span>, <span class="font-mono font-bold text-slate-700">Daily Downtime Entry sheet Import file.xlsx</span>)</p>
        </div>

        <!-- Telemetry & Summary Card (Hidden until file selected/parsed) -->
        <div id="importPreviewSummary" class="hidden p-4 rounded-xl bg-slate-900 text-white space-y-3">
          <div class="flex items-center justify-between border-b border-slate-800 pb-2">
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <span id="importFileName" class="text-xs font-mono font-bold text-slate-200 truncate max-w-[280px]">file.xlsx</span>
            </div>
            <span id="importRecordCountBadge" class="px-2 py-0.5 rounded text-[10px] font-black bg-[#E60012] text-white font-mono">0 Incidents Found</span>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-xs">
            <div class="p-2 bg-slate-800/80 rounded-lg border border-slate-700">
              <span class="text-[10px] text-slate-400 block">Total Records</span>
              <span id="importStatCount" class="text-sm font-black font-mono text-white">0</span>
            </div>
            <div class="p-2 bg-slate-800/80 rounded-lg border border-slate-700">
              <span class="text-[10px] text-slate-400 block">Total Downtime</span>
              <span id="importStatHours" class="text-sm font-black font-mono text-amber-400">0.0h</span>
            </div>
            <div class="p-2 bg-slate-800/80 rounded-lg border border-slate-700">
              <span class="text-[10px] text-slate-400 block">Date Range</span>
              <span id="importStatDateRange" class="text-[11px] font-bold font-mono text-slate-300">-</span>
            </div>
            <div class="p-2 bg-slate-800/80 rounded-lg border border-slate-700">
              <span class="text-[10px] text-slate-400 block">Open Incidents</span>
              <span id="importStatOpen" class="text-sm font-black font-mono text-rose-400">0</span>
            </div>
          </div>
        </div>

        <!-- Import Mode Selection (SYNC-01: Default to Safe Append Mode) -->
        <div id="importModeContainer" class="hidden p-3.5 rounded-xl border border-slate-200 bg-white space-y-2">
          <label class="form-label-modern mb-1 block">Import Mode Option:</label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
            <label class="flex items-center gap-2 p-2.5 rounded-lg border border-emerald-200 bg-emerald-50/50 hover:bg-emerald-50 cursor-pointer">
              <input type="radio" id="importModeAppend" name="importModeRadio" value="append" checked onchange="handleImportModeChange()" class="text-emerald-600 focus:ring-emerald-500">
              <div>
                <span class="font-bold text-slate-800 block">Append to Existing Logs (Recommended)</span>
                <span class="text-[10px] text-slate-500">Safely add imported incidents without erasing historical logs</span>
              </div>
            </label>
            <label class="flex items-center gap-2 p-2.5 rounded-lg border border-slate-200 bg-slate-50 hover:bg-slate-100 cursor-pointer">
              <input type="radio" id="importModeReplace" name="importModeRadio" value="replace" onchange="handleImportModeChange()" class="text-[#E60012] focus:ring-red-500">
              <div>
                <span class="font-bold text-slate-800 block">Replace Existing Logs (Admin Only)</span>
                <span class="text-[10px] text-slate-500">Overwrite entire database with these imported records</span>
              </div>
            </label>
          </div>
          <!-- Red Warning Banner when Replace is selected -->
          <div id="replaceWarningBanner" class="hidden p-3 rounded-lg bg-red-950/40 border border-red-500/50 text-red-300 text-xs flex items-center gap-2">
            <i class="fa-solid fa-triangle-exclamation text-red-400 text-sm shrink-0"></i>
            <span><strong>CRITICAL WARNING:</strong> Replace mode will permanently erase all historical incident logs and replace them. Admin authorization required.</span>
          </div>
        </div>

        <!-- Preview Table (Scrollable) -->
        <div id="importPreviewTableWrapper" class="hidden space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5">
              <i class="fa-solid fa-table-list text-slate-500"></i> Parsed Incident Records Preview (First 10)
            </span>
            <span id="importPreviewNote" class="text-[10px] text-slate-400 font-mono">Showing preview</span>
          </div>
          <div class="overflow-x-auto rounded-lg border border-slate-200 max-h-56 overflow-y-auto">
            <table class="w-full text-left border-collapse text-xs">
              <thead class="sticky top-0 bg-slate-900 text-white uppercase text-[10px] tracking-wider z-10">
                <tr>
                  <th class="px-3 py-2">#</th>
                  <th class="px-3 py-2">Date</th>
                  <th class="px-3 py-2">Machine Code</th>
                  <th class="px-3 py-2">Area / Plant</th>
                  <th class="px-3 py-2">Process</th>
                  <th class="px-3 py-2 text-right">DT Min</th>
                  <th class="px-3 py-2 text-center">Affected</th>
                  <th class="px-3 py-2 text-right">Total DT</th>
                  <th class="px-3 py-2">Loss Category</th>
                  <th class="px-3 py-2">Nature</th>
                  <th class="px-3 py-2">Status</th>
                </tr>
              </thead>
              <tbody id="importPreviewTableBody" class="divide-y divide-slate-100 bg-white">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>
        </div>

      </div>

      <!-- Modal Footer -->
      <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex flex-wrap items-center justify-between gap-2 flex-shrink-0">
        <button type="button" onclick="closeImportDowntimeModal()" class="px-4 py-2 text-xs font-bold text-slate-500 hover:text-slate-800 transition-colors cursor-pointer">
          Cancel
        </button>
        <button type="button" id="btnConfirmDowntimeImport" onclick="confirmDowntimeImport()" disabled class="px-5 py-2 text-xs font-black rounded-xl bg-violet-600 hover:bg-violet-700 disabled:opacity-40 disabled:cursor-not-allowed text-white flex items-center gap-1.5 shadow-sm transition-all active:scale-95 cursor-pointer">
          <i class="fa-solid fa-check"></i>
          <span>Confirm & Import Records</span>
        </button>
      </div>

    </div>
  </div>

  <!-- =========================================================================
       MODAL: DESTRUCTIVE ACTION VERIFICATION (SEC-07: Admin Only + CONFIRM RESET)
       ========================================================================= -->
  <div id="confirmResetModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs hidden flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="confirmResetTitle">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 border-t-4 border-rose-600 animate-scale-up" onclick="event.stopPropagation()">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-12 h-12 rounded-xl bg-rose-50 border border-rose-200 flex items-center justify-center text-rose-600 text-xl shrink-0">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <div>
          <h3 id="confirmResetTitle" class="text-base font-black text-slate-900 tracking-tight">Confirm Destructive Action</h3>
          <p id="confirmResetSubtitle" class="text-xs text-slate-500">Administrator authorization and typing confirmation required</p>
        </div>
      </div>

      <div class="p-3.5 rounded-xl bg-rose-50/70 border border-rose-200 mb-4 text-xs text-rose-800 leading-relaxed">
        <p id="confirmResetDescription">
          This operation is permanent and cannot be undone. An automatic backup snapshot will be downloaded to your computer immediately before execution.
        </p>
      </div>

      <div class="space-y-3 mb-5">
        <label for="confirmResetInput" class="block text-xs font-bold text-slate-700">
          Type <span class="font-mono bg-slate-100 text-rose-600 px-1.5 py-0.5 rounded border border-slate-200 select-all">CONFIRM RESET</span> to proceed:
        </label>
        <input type="text" id="confirmResetInput" placeholder="CONFIRM RESET" autocomplete="off" class="form-input-modern text-xs font-mono font-bold tracking-wider" oninput="handleConfirmResetInputChanged()">
        <p id="confirmResetError" class="text-[11px] font-bold text-rose-600 hidden">Confirmation phrase does not match.</p>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2 border-t border-slate-100">
        <button type="button" onclick="closeConfirmResetModal()" class="px-4 py-2 text-xs font-bold text-slate-600 hover:text-slate-800 transition-colors">
          Cancel
        </button>
        <button type="button" id="btnExecuteDestructiveAction" disabled onclick="executeDestructiveActionConfirmed()" class="px-5 py-2 text-xs font-black rounded-xl bg-rose-600 hover:bg-rose-700 disabled:opacity-40 disabled:cursor-not-allowed text-white flex items-center gap-1.5 shadow-sm transition-all active:scale-95">
          <i class="fa-solid fa-trash-can"></i>
          <span id="confirmResetBtnLabel">Execute Reset</span>
        </button>
      </div>
    </div>
  </div>

  <!-- =========================================================================
       GLOBAL COMMAND PALETTE MODAL (CTRL+K / CMD+K)
       ========================================================================= -->
  <div id="cmdPaletteBackdrop" class="cmd-palette-backdrop hidden" onclick="closeCommandPalette()">
    <div class="cmd-palette-modal mx-4 w-full max-w-xl animate-scale-up" onclick="event.stopPropagation()">
      <!-- Search Input Header -->
      <div class="p-4 border-b border-slate-100 flex items-center gap-3 bg-white">
        <i class="fa-solid fa-magnifying-glass text-slate-400 text-sm"></i>
        <input type="text" id="cmdPaletteInput" placeholder="Type a command or jump to area, machine, filter, view preset..." class="w-full text-sm font-semibold text-slate-900 bg-transparent border-none focus:outline-none placeholder-slate-400">
        <span class="text-[10px] font-mono font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded border border-slate-200">ESC</span>
      </div>
      <!-- Quick Categories / Navigation Results -->
      <div id="cmdPaletteResults" class="max-h-80 overflow-y-auto p-2 space-y-0.5 bg-white">
        <!-- Dynamically populated by observability-dashboard.js -->
      </div>
      <!-- Footer Hints -->
      <div class="px-4 py-2 bg-slate-50 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-500 font-mono">
        <span class="flex items-center gap-2">
          <span><kbd class="px-1.5 py-0.5 bg-white border border-slate-200 rounded text-[10px]">↑</kbd> <kbd class="px-1.5 py-0.5 bg-white border border-slate-200 rounded text-[10px]">↓</kbd> Navigate</span>
          <span><kbd class="px-1.5 py-0.5 bg-white border border-slate-200 rounded text-[10px]">↵</kbd> Select</span>
        </span>
        <span class="text-slate-400 font-semibold">Plant IT Command Hub</span>
      </div>
    </div>
  </div>

  </template><!-- End of #authenticatedAppTemplate -->

  <!-- Toast Notification Container -->
  <div id="toast-container"></div>

  <!-- Footer -->
  <footer class="bg-[#0F1115] text-slate-400 text-xs py-6 border-t border-slate-800 mt-12 no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-red-600/20 border border-red-500/30 flex items-center justify-center text-[#E60012] shadow-xs">
          <i class="fa-solid fa-industry text-sm"></i>
        </div>
        <div>
          <span class="font-bold text-slate-200">Plant IT Downtime Management Portal</span>
          <span class="text-slate-500 text-[11px] ml-2 hidden sm:inline">&bull; Yokohama Tire Operations</span>
        </div>
      </div>

      <!-- Glassy Badge: Built by Hadssha Bell S & Reuben Geoffrey -->
      <div class="inline-flex items-center gap-2.5 px-4 py-1.5 rounded-full bg-white/[0.05] hover:bg-white/[0.1] border border-white/[0.15] hover:border-red-500/40 backdrop-blur-md shadow-[0_4px_20px_rgba(0,0,0,0.3),inset_0_1px_1px_rgba(255,255,255,0.2)] transition-all duration-300 group">
        <div class="relative flex items-center justify-center w-6 h-6 rounded-full bg-gradient-to-tr from-[#E60012]/50 via-red-500/30 to-white/20 border border-white/35 shadow-[inset_0_1px_2px_rgba(255,255,255,0.5),0_2px_8px_rgba(230,0,18,0.4)]">
          <i class="fa-solid fa-code text-[#FF4D5E] text-[10px] group-hover:scale-110 transition-transform"></i>
          <span class="absolute -top-0.5 -right-0.5 w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        </div>
        <span class="text-[11px] font-medium text-slate-300 tracking-wide">
          Built by <span class="text-white font-extrabold tracking-normal">Hadssha Bell S</span> &amp; <span class="text-white font-extrabold tracking-normal">Reuben Geoffrey</span>
        </span>
      </div>
    </div>
  </footer>

  <!-- Application Logic -->
  <script src="app.js?v=5.4"></script>
  <!-- Enterprise Observability & Advanced Visualizations Engine -->
  <script src="observability-dashboard.js?v=1.0"></script>

</body>
</html>
